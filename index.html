<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umesh AI Creator</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  padding:20px;
}

.box{
  max-width:700px;
  margin:30px auto;
  background:#1e293b;
  padding:25px;
  border-radius:20px;
}

h1{text-align:center}

textarea{
  width:100%;
  height:150px;
  box-sizing:border-box;
  padding:15px;
  border-radius:12px;
  border:0;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:18px;
  font-weight:bold;
}

button:disabled{opacity:.5}

#status{
  margin-top:15px;
  color:#93c5fd;
}

#result{
  margin-top:15px;
  padding:18px;
  background:#020617;
  border-radius:12px;
  white-space:pre-wrap;
  min-height:150px;
}
</style>
</head>

<body>

<div class="box">

<h1>🤖 Umesh AI Creator</h1>

<p>Apna prompt likho:</p>

<textarea id="topic"
placeholder="Example: Horror story ke liye 3 title aur 10 hashtags banao"></textarea>

<button id="generateBtn">Generate AI</button>

<div id="status">AI ready nahi hai.</div>

<div id="result">AI ka answer yahan dikhega...</div>

</div>

<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

let generator = null;

const MODEL =
"onnx-community/Qwen3-0.6B-Instruct-ONNX";

async function loadAI(){

  if(generator) return generator;

  document.getElementById("status").textContent =
  "AI model load ho raha hai... pehli baar bahut time lag sakta hai.";

  generator = await pipeline(
    "text-generation",
    MODEL,
    {
      dtype:"q4"
    }
  );

  document.getElementById("status").textContent =
  "AI Ready ✅";

  return generator;
}

async function generateAI(){

  const topic =
  document.getElementById("topic").value.trim();

  const result =
  document.getElementById("result");

  const button =
  document.getElementById("generateBtn");

  if(!topic){
    result.textContent="Pehle prompt likho.";
    return;
  }

  button.disabled=true;

  try{

    const ai=await loadAI();

    result.textContent="AI answer bana raha hai...";

    const messages=[
      {
        role:"system",
        content:
        "You are Umesh AI Creator. Follow the user's request exactly. Answer in simple Hindi or Hinglish. Give only useful content."
      },
      {
        role:"user",
        content:topic
      }
    ];

    const output=await ai(messages,{
      max_new_tokens:300,
      do_sample:false
    });

    const generated=
    output?.[0]?.generated_text;

    if(Array.isArray(generated)){

      result.textContent=
      generated[generated.length-1]?.content ||
      "AI ne answer nahi diya.";

    }else{

      result.textContent=
      String(generated || "AI ne answer nahi diya.");
    }

  }catch(error){

    console.error(error);

    result.textContent=
    "AI model load nahi ho paya. Phone/browser me model chalane ke liye resources kam ho sakte hain.";

    document.getElementById("status").textContent=
    "AI Error ❌";
  }

  button.disabled=false;
}

document
.getElementById("generateBtn")
.addEventListener("click",generateAI);

</script>

</body>
</html>
