<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Umesh AI Creator</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.box {
  max-width: 700px;
  margin: 30px auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 20px;
}

h1 {
  text-align: center;
}

textarea {
  width: 100%;
  height: 150px;
  box-sizing: border-box;
  padding: 15px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
}

#status {
  margin-top: 15px;
  color: #93c5fd;
}

#result {
  margin-top: 15px;
  padding: 18px;
  background: #020617;
  border-radius: 12px;
  white-space: pre-wrap;
  min-height: 150px;
}
</style>
</head>

<body>

<div class="box">

<h1>🤖 Umesh AI Creator</h1>

<p>Apna kaam likho:</p>

<textarea id="topic"
placeholder="Example: Horror story ke liye title aur hashtags banao"></textarea>

<button id="generateBtn">
Generate AI
</button>

<div id="status">
AI model abhi load nahi hua.
</div>

<div id="result">
AI ka answer yahan dikhega...
</div>

</div>

<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

let generator = null;

const MODEL =
"onnx-community/Qwen3-0.6B-Instruct-ONNX";


async function loadAI() {

  if (generator) {
    return generator;
  }

  document.getElementById("status").textContent =
  "AI model load ho raha hai... pehli baar thoda time lagega.";

  generator = await pipeline(
    "text-generation",
    MODEL,
    {
      device: "webgpu",
      dtype: "q4f16"
    }
  );

  document.getElementById("status").textContent =
  "AI Ready ✅";

  return generator;
}


async function generateAI() {

  const topic =
  document.getElementById("topic").value.trim();

  const result =
  document.getElementById("result");

  const button =
  document.getElementById("generateBtn");


  if (!topic) {

    result.textContent =
    "Pehle apna kaam likho.";

    return;
  }


  button.disabled = true;

  result.textContent =
  "AI answer bana raha hai...";


  try {

    const ai = await loadAI();


    const messages = [

      {
        role: "system",

        content:
        `You are Umesh AI Creator.

You are a helpful content creation AI.

Understand exactly what the user asks.

If the user asks for a YouTube title, give titles.

If the user asks for hashtags, give hashtags.

If the user asks for a description, give a description.

If the user asks for a horror story, write a horror story.

If the user asks for multiple things, provide all requested things.

Answer in simple Hindi or Hinglish.

Do not change the user's topic.

Do not talk about unrelated subjects.

Do not repeat the user's question.

Give only the useful answer.`
      },

      {
        role: "user",

        content: topic
      }

    ];


    const output = await ai(
      messages,
      {
        max_new_tokens: 400,
        do_sample: true,
        temperature: 0.6
      }
    );


    const generated =
    output?.[0]?.generated_text;


    if (Array.isArray(generated)) {

      const last =
      generated[generated.length - 1];

      result.textContent =
      last?.content ||
      "AI ne answer nahi diya.";

    } else {

      result.textContent =
      String(
        generated ||
        "AI ne answer nahi diya."
      );

    }

  }

  catch (error) {

    console.error(error);

    result.textContent =
    "AI chalane me problem aa gayi. Page refresh karke dobara try karo.";

    document.getElementById("status").textContent =
    "AI Error ❌";

  }

  finally {

    button.disabled = false;

  }

}


document
.getElementById("generateBtn")
.addEventListener(
  "click",
  generateAI
);

</script>

</body>
</html>
