<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umesh AI Creator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: #1f2937;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }

    #result {
      margin-top: 15px;
      padding: 15px;
      background: #374151;
      border-radius: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🤖 Umesh AI Creator</h1>

  <p>Apna topic likho:</p>

  <textarea id="topic" placeholder="Example: Horror story, YouTube video, motivation..."></textarea>

  <button onclick="generate()">Generate</button>

  <div id="result">Result yahan dikhega...</div>
</div>

<script>
function generate() {
  const topic = document.getElementById("topic").value;

  if (!topic.trim()) {
    document.getElementById("result").innerText =
      "Pehle apna topic likho.";
    return;
  }

  document.getElementById("result").innerText =
    "Aapke topic: " + topic +
    "\\n\\nAI tool ka basic system ready hai. " +
    "Agale step me real AI connection add karenge.";
}
</script>

</body>
</html>
