<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umesh AI Creator</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.box {
  width: 90%;
  max-width: 700px;
  margin-top: 50px;
  padding: 25px;
  background: #1e293b;
  border-radius: 20px;
  box-shadow: 0 0 25px #000;
}

h1 {
  text-align: center;
}

textarea {
  width: 100%;
  height: 130px;
  padding: 12px;
  box-sizing: border-box;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
}

#status {
  margin-top: 15px;
  color: #93c5fd;
}

#result {
  margin-top: 15px;
  padding: 15px;
  background: #020617;
  border-radius: 12px;
  white-space: pre-wrap;
  min-height: 100px;
}
</style>
</head>

<body>

<div class="box">

<h1>🤖 Umesh AI Creator</h1>

<p>Apna topic likho:</p>

<textarea id="topic"
placeholder="Example: Ek scary horror story banao"></textarea>

<button id="generateBtn">Generate AI</button>

<div id="status">
AI model abhi load nahi hua.
</div>

<div id="result">
AI ka result yahan dikhega...
</div>

</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

let generator = null;

const MODEL = "onnx-community/Qwen3-0.6B-ONNX";

async function loadModel() {

  if (generator) return generator;

  const status = document.getElementById("status");

  status.textContent =
  "AI model load ho raha hai... pehli baar thoda time lagega.";

  generator = await pipeline(
    "text-generation",
    MODEL,
    {
      device: "webgpu",
      dtype: "q4f16"
    }
  );

  status.textContent = "AI Ready ✅";

  return generator;
}

async function generateAI() {

  const topic =
  document.getElementById("topic").value.trim();

  const result =
  document.getElementById("result");

  const button =
  document.getElementById("generateBtn");

  if (!topic) {
    result.textContent =
    "Pehle koi topic likho.";
    return;
  }

  button.disabled = true;

  try {

    const ai = await loadModel();

    result.textContent =
    "AI answer bana raha hai...";

    const messages = [

      {
        role: "system",
        content:
        "You are Umesh AI Creator. Answer in simple Hindi or Hinglish. Give useful, original and safe content."
      },

      {
        role: "user",
        content:
        "Create useful content for this topic: " + topic
      }

    ];

    const output = await ai(messages, {

      max_new_tokens: 300,

      do_sample: true,

      temperature: 0.7

    });

    const text =
    output?.[0]?.generated_text;

    if (Array.isArray(text)) {

      result.textContent =
      text[text.length - 1]?.content ||
      "AI ne output nahi diya.";

    } else {

      result.textContent =
      String(text || "AI ne output nahi diya.");

    }

  } catch (error) {

    result.textContent =
    "AI start nahi ho paya. Browser/WebGPU support check karo.";

    console.error(error);

  } finally {

    button.disabled = false;

  }
}

document
.getElementById("generateBtn")
.addEventListener("click", generateAI);

</script>

</body>
</html>
